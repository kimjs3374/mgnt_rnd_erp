<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과제 · 연구비 계상 · RCMS 정산 — 시제품</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --line2:#eef0f3;
  --tx:#1a1d21; --tx2:#5b6470; --tx3:#8a929c;
  --pri:#1f5fd0; --pri-bg:#eaf1fd;
  --ok:#1a7f4b; --ok-bg:#e8f5ee;
  --warn:#a8620a; --warn-bg:#fdf3e4;
  --bad:#c0392b; --bad-bg:#fdecea;
  --lock:#6b5bd2; --lock-bg:#efedfc;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.6 "Pretendard","맑은 고딕","Malgun Gothic",system-ui,sans-serif}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--pri)}

/* ── 레이아웃 ─────────────────────────────── */
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.top h1{font-size:16px}
.proto{font-size:11.5px;color:var(--warn);background:var(--warn-bg);
  border:1px solid #f0dcbb;padding:3px 9px;border-radius:99px;font-weight:600}
.top .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:20px}

/* ── 공통 부품 ─────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:16px}
.card>h3{font-size:14.5px;margin-bottom:4px}
.card>.sub{font-size:12.5px;color:var(--tx2);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--tx);
  padding:7px 13px;border-radius:6px;font-size:13px;font-weight:600}
.btn:hover{background:#f2f4f7}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#1a52b4}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;
  flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 14px;font-size:13.5px;color:var(--tx2);font-weight:600;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button:hover{color:var(--tx)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;
  border-radius:99px;white-space:nowrap}
.b-plan{background:#eef0f3;color:var(--tx2)}
.b-run{background:var(--pri-bg);color:var(--pri)}
.b-done{background:var(--lock-bg);color:var(--lock)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line2);font-size:13px}
th{background:#fafbfc;text-align:left;color:var(--tx2);font-weight:600;font-size:12.5px;
  white-space:nowrap}
tbody tr:hover{background:#fafbfc}
tfoot td{font-weight:700;background:#fafbfc;border-top:2px solid var(--line)}
.muted{color:var(--tx3)}
.small{font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-bg);border-color:var(--pri)}
input.num{text-align:right}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--tx2);font-weight:600}
.grid{display:grid;gap:12px}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:#fafbfc;border:1px solid var(--line2);border-radius:6px;padding:11px 13px}
.kpi .k{font-size:11.5px;color:var(--tx2);font-weight:600}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .u{font-size:11.5px;color:var(--tx3);font-weight:500}

/* 진행바 */
.bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.over{background:var(--bad)}
.bar i.near{background:var(--warn)}

/* 알림 박스 */
.note{border-radius:6px;padding:10px 13px;font-size:12.5px;margin-bottom:12px;
  border:1px solid}
.note.i{background:var(--pri-bg);border-color:#cfe0fa;color:#174a9e}
.note.w{background:var(--warn-bg);border-color:#f0dcbb;color:var(--warn)}
.note.e{background:var(--bad-bg);border-color:#f6cfca;color:var(--bad)}
.note.o{background:var(--ok-bg);border-color:#cbe8d8;color:var(--ok)}
.note b{font-weight:700}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 11px;color:var(--tx2);
  font-size:12px;margin-top:6px}

/* 과제 목록 */
.plist{display:grid;gap:10px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px}
.pitem:hover{border-color:var(--pri);box-shadow:0 1px 6px rgba(31,95,208,.09)}
.pitem .nm{font-weight:700;font-size:14px;margin-bottom:3px}
.pitem .meta{font-size:12px;color:var(--tx2)}
.pitem .rt{text-align:right;min-width:190px}

/* 모달 */
.mask{position:fixed;inset:0;background:rgba(20,24,30,.42);display:flex;
  align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:10px;max-width:620px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal .hd{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700}
.modal .bd{padding:20px}
.modal .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;
  justify-content:flex-end;gap:8px;background:#fafbfc;position:sticky;bottom:0}

/* 체크리스트 */
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line2);font-size:13px}
.chk .nm{flex:1}
.chk .tg{display:flex;gap:4px}
.tg button{border:1px solid var(--line);background:#fff;padding:3px 9px;
  border-radius:5px;font-size:11.5px;color:var(--tx2)}
.tg button.on{background:var(--ok-bg);border-color:#a8d6bd;color:var(--ok);font-weight:700}
.tg button.na.on{background:#eef0f3;border-color:#d6dae0;color:var(--tx2)}

.hide{display:none!important}
.stack{display:flex;flex-direction:column;gap:2px}
.wide{overflow-x:auto}
.foot{color:var(--tx3);font-size:11.5px;text-align:center;padding:26px 0}
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   3. 계상 계산 — 단위 천원
   ══════════════════════════════════════════════════════════════ */
function bud(pid){ return S.budgets.filter(b=>b.pid===pid); }
function bget(pid,c,src){
  let b=S.budgets.find(x=>x.pid===pid&&x.cat===c&&x.src===src);
  if(!b){ b={pid,cat:c,src,y:[0,0,0,0,0]}; S.budgets.push(b); }
  while(b.y.length<5) b.y.push(0);
  return b;
}
const bsum = b => b.y.reduce((a,v)=>a+(+v||0),0);

// 비목별 총 계상(천원)
function catTotal(pid,c){
  return bud(pid).filter(b=>b.cat===c).reduce((a,b)=>a+bsum(b),0);
}
// 재원별 총 계상(천원)
function srcTotal(pid,src){
  return bud(pid).filter(b=>b.src===src).reduce((a,b)=>a+bsum(b),0);
}
function planTotal(pid){ return bud(pid).reduce((a,b)=>a+bsum(b),0); }

// 수정인건비 = 현금·현물 인건비 + 학생인건비  (연구근접지원인력 제외 — 여기선 미구현)
function payBase(pid){ return catTotal(pid,'PERSONNEL') + catTotal(pid,'STUDENT'); }

// 검증 — 공고에서 읽은 한도 규칙을 그대로 쓴다
function verify(pid){
  const p = S.projects.find(x=>x.id===pid);
  const R = p.rules || DEFAULT_RULES;
  const out=[], tot=planTotal(pid);
  const gov=srcTotal(pid,'출연금'), cash=srcTotal(pid,'현금'), kind=srcTotal(pid,'현물');
  const own=cash+kind;

  // ① 협약 과제비와 계상 합계
  if(p.contract>0){
    const c=Math.round(p.contract/1000);
    out.push(mk('계상 합계 = 협약 과제비', tot===c,
      `계상 ${won(tot)}천원 / 협약 ${won(c)}천원`, tot-c));
  }
  // ② 정부출연금 비율
  if(tot>0){
    const r=gov/tot*100;
    out.push(mk(`정부출연금 ${R.gov}% 이내`, r<=R.gov+1e-9,
      `현재 ${r.toFixed(1)}%`, Math.round(gov-tot*R.gov/100)));
  }
  // ③ 기관부담 현금 최소 / 현물 최대
  if(own>0){
    const rc=cash/own*100, rk=kind/own*100;
    out.push(mk(`기관부담 현금 ${R.cash}% 이상`, rc>=R.cash-1e-9,
      `현재 ${rc.toFixed(1)}%`, Math.round(own*R.cash/100-cash)));
    out.push(mk(`기관부담 현물 ${R.kind}% 이하`, rk<=R.kind+1e-9,
      `현재 ${rk.toFixed(1)}%`, Math.round(kind-own*R.kind/100)));
  }
  // ④ 연구수당 한도 — 수정인건비 기준
  const base=payBase(pid), lim=Math.floor(base*R.allow/100/100)*100; // 백원 절사
  const al=catTotal(pid,'ALLOWANCE');
  out.push(mk(`연구수당 수정인건비의 ${R.allow}% 이내`, al<=lim,
    `계상 ${won(al)}천원 / 한도 ${won(lim)}천원 (수정인건비 ${won(base)}천원)`, al-lim));
  // ⑤ 간접비 한도
  const direct=CATS.filter(c=>c.direct).reduce((a,c)=>a+catTotal(pid,c.c),0);
  const consign=0; // 위탁은 세부항목이라 여기선 0으로 둔다
  const ibase=direct-kind-consign;
  const ilim=Math.floor(ibase*R.ind/(100+R.ind)/1000)*1000; // 백만원 절사(천원 단위 표기)
  const ind=catTotal(pid,'INDIRECT');
  out.push(mk(`간접비 ${R.ind}% 이내 (역산)`, ind<=ilim,
    `계상 ${won(ind)}천원 / 한도 ${won(ilim)}천원`, ind-ilim));
  return out;
}
function mk(name, ok, detail, gap){ return {name, ok, detail, gap:Math.round(gap||0)}; }
const DEFAULT_RULES = {gov:75, cash:10, kind:90, allow:20, ind:10, consign:40};

/* ══════════════════════════════════════════════════════════════
   4. 정산 — 단위 원
   ══════════════════════════════════════════════════════════════ */
function exps(pid){ return S.expenses.filter(e=>e.pid===pid); }
// 배정액(원) = 계상(천원) × 1000  ← 단위 환산은 이 한 지점에서만 한다
function alloc(pid,c,src){ return bsum(bget(pid,c,src))*1000; }
function used(pid,c,src){
  return exps(pid).filter(e=>e.cat===c&&e.src===src&&COUNTED.includes(e.status))
    .reduce((a,e)=>a+e.total,0);
}
function ledger(pid){
  const rows=[];
  for(const C of CATS) for(const s of SRCS){
    const a=alloc(pid,C.c,s); const u=used(pid,C.c,s);
    if(a===0&&u===0) continue;
    rows.push({cat:C.c, name:C.n, src:s, alloc:a, used:u, left:a-u,
      rate: a>0 ? u/a*100 : (u>0?Infinity:0)});
  }
  return rows;
}
// 필요한 증빙 목록
function needDocs(e){
  return EV_RULES.filter(r=>(r.pay===null||r.pay===e.pay) && e.supply>=r.min);
}
function evStat(e){
  const need=needDocs(e).filter(r=>r.req);
  const missing=need.filter(r=>e.docs[r.d]!=='have'&&e.docs[r.d]!=='na').map(r=>r.d);
  return {need:need.length, have:need.length-missing.length, missing, ok:missing.length===0};
}
function projKpi(pid){
  const es=exps(pid);
  const plan=planTotal(pid)*1000;
  const spent=es.filter(e=>COUNTED.includes(e.status)).reduce((a,e)=>a+e.total,0);
  const bad=es.filter(e=>!evStat(e).ok).length;
  return {plan, spent, rate: plan>0? spent/plan*100 : 0,
    cnt:es.length, bad, evRate: es.length? (es.length-bad)/es.length*100 : 100};
}

    </div>`:`<div class="note w">공고를 연결하면 한도 규칙이 자동으로 장착됩니다.</div>`}

      <span class="small muted">총액을 연차 수(${p.years}년)로 나눠 미리 채웁니다. 합계는 보존됩니다.</span>
    </div>
  </div>

  <div class="card">
    <h3>비목별 편성 <span class="small muted" style="font-weight:400">단위: 천원</span></h3>

const ruleRow=(a,b,q)=>`<tr><th>${a}</th><td class="num">${b}</td>
  <td><div class="quote">"${q}"</div></td></tr>`;

function setBud(pid,c,src,y,val){
  const b=bget(pid,c,src); b.y[y-1]=Math.max(0,Math.round(+val||0));
  render();
}
function setContract(){
  const p=P(), v=Math.max(0,Math.round(+document.getElementById('contract').value||0));
  p.contract=v; log(p.id,'협약 과제비 입력 — '+won(v)+'원'); render();
}
function autoSpread(){
  const p=P();
  if(!p.contract){ alert('협약 과제비를 먼저 입력해 주세요.'); return; }
  const tot=planTotal(p.id);
  if(tot===0){ alert('먼저 비목별 금액을 넣어 주세요. 그 비율대로 나눕니다.'); return; }
  const target=Math.round(p.contract/1000);
  // 현재 비율을 유지한 채 합계를 협약액에 맞춘다 — 합계 보존
  let acc=0; const rows=bud(p.id);
  rows.forEach((b,i)=>{
    const share = bsum(b)/tot;
    let v = i===rows.length-1 ? target-acc : Math.round(target*share);
    acc+=v;
    const per=Math.floor(v/p.years), rest=v-per*(p.years-1);
    for(let y=0;y<p.years;y++) b.y[y] = (y===p.years-1? rest : per);
  });
  log(p.id,'차년도 자동 배분 — 협약액 '+won(p.contract)+'원 기준');
  render();
}
function fixPlan(){
  const p=P(), v=verify(p.id), bad=v.filter(x=>!x.ok);
  let msg = p.fixed
    ? '계상을 다시 확정합니다. 정산 탭의 배정액이 갱신됩니다.\n'
    : '계상을 확정하고 RCMS 정산 탭에 과제비 원장을 만듭니다.\n';
  if(bad.length){
    msg += '\n⚠ 검증 위반 '+bad.length+'건이 남아 있습니다.\n'
        + bad.map(b=>'  · '+b.name+'  ('+(b.gap>0?'+':'')+won(b.gap)+'천원)').join('\n')
        + '\n\n위반인 채로 확정할 수 있지만, 정산에서 걸릴 수 있습니다.\n';
  }
  // 이미 집행된 금액보다 작게 줄이면 경고
  const shrink=[];
  for(const C of CATS) for(const s of SRCS){
    const u=used(p.id,C.c,s), a=alloc(p.id,C.c,s);
    if(u>a) shrink.push(`  · ${C.n}/${s} — 집행 ${won(u)}원 > 배정 ${won(a)}원`);
  }
  if(shrink.length) msg += '\n⚠ 이미 집행된 금액이 배정액을 넘습니다.\n'+shrink.join('\n')+'\n';
  msg += '\n계속할까요?';
  if(!confirm(msg)) return;
  p.fixed=true;
  log(p.id, (p.fixed?'계상 확정':'계상 재확정')+' — 정산 과제비 원장 '+
    (p.fixed?'생성':'갱신')+' (위반 '+bad.length+'건)');
  view.tab='RCMS 정산'; render();
}

function limitWarn(p){
  const R=p.rules||DEFAULT_RULES, out=[];
  const L=ledger(p.id);
  L.filter(r=>r.left<0).forEach(r=>out.push(
    `<b>${r.name} / ${r.src}</b> 배정액을 ${won(-r.left)}원 초과했습니다`));
  const v=verify(p.id).filter(x=>!x.ok);
  v.forEach(x=>out.push(`<b>${x.name}</b> — ${x.detail}`));
  if(!out.length) return `<div class="note o" style="margin-top:12px">한도 위반이 없습니다.</div>`;
  return `<div class="note e" style="margin-top:12px"><b>한도 경고 ${out.length}건</b>
    <ul style="margin:6px 0 0;padding-left:18px">${out.map(o=>`<li>${o}</li>`).join('')}</ul>
    <div style="margin-top:6px">근거 원문은 「연구비 계상」 탭 상단에 있습니다.</div></div>`;
}
function nextBtn(e){
  const nx={'검토대기':'확정','확정':'제출','제출':'정산완료','반려':'보완중','보완중':'제출'}[e.status];
  if(!nx) return '';
  return `<button class="btn sm" onclick="advance(${e.id})">${nx}로</button>`;
}
function advance(id){
  const e=S.expenses.find(x=>x.id===id), p=S.projects.find(x=>x.id===e.pid);
  const nx={'검토대기':'확정','확정':'제출','제출':'정산완료','반려':'보완중','보완중':'제출'}[e.status];
  const v=evStat(e);
  if(nx==='확정'&&!v.ok){
    if(!confirm(`증빙이 ${v.missing.length}건 빠졌습니다 — ${v.missing.join(', ')}\n`+
      `이대로 확정하면 정산에서 반려될 수 있습니다. 계속할까요?`)) return;
  }
  if(nx==='정산완료'){
    if(!confirm('「정산완료」는 기관이 통보한 결과를 사람이 확인하고 누르는 자리입니다.\n'+
      '시스템이 자동으로 넘기지 않습니다. 실제로 정산이 끝났습니까?')) return;
  }
  // 배정액 초과 검사
  if(nx==='확정'){
    const a=alloc(e.pid,e.cat,e.src), u=used(e.pid,e.cat,e.src);
    if(u+e.total>a){
      const over=u+e.total-a;
      const why=prompt(`${cat(e.cat)} / ${e.src} 배정액을 ${won(over)}원 초과합니다.\n`+
        `사유를 적으면 등록됩니다. (비우면 취소)`);
      if(!why||!why.trim()) return;
      e.memo=(e.memo?e.memo+' / ':'')+'한도초과 사유: '+why.trim();
      log(e.pid,`한도 초과 확정 — ${e.item} (${won(over)}원 초과) · ${why.trim()}`);
    }
  }
  e.status=nx;
  log(e.pid,`사용 건 상태 전이 — ${e.item} → ${nx}`);
  render();
}

/* ══════════════════════════════════════════════════════════════
   9. 모달 — 사용 건
   ══════════════════════════════════════════════════════════════ */
let M=null;
function openExp(id){
  const p=P();
  M = id ? JSON.parse(JSON.stringify(S.expenses.find(e=>e.id===id)))
         : {id:0,pid:p.id,date:new Date().toISOString().slice(0,10),cat:'FACILITY',
            sub:SUBS.FACILITY[0],item:'',vendor:'',supply:0,vat:0,total:0,
            pay:'계좌송금',owner:'나예찬',status:'검토대기',src:'출연금',docs:{},memo:''};
  drawExp();
}
function drawExp(){
  const p=P(), lock=p.status==='완료';
  const need=needDocs(M), v=evStat(M);
  const a=alloc(p.id,M.cat,M.src), u=used(p.id,M.cat,M.src);
  const willOver = u+(+M.total||0) > a;
  document.body.insertAdjacentHTML('beforeend',`
  <div class="mask" id="mask"><div class="modal">
    <div class="hd">${M.id?'사용 건':'사용 건 등록'}</div>
    <div class="bd">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        ${fld('사용일',`<input type="date" id="m_date" value="${M.date}" ${lock?'disabled':''}>`)}
        ${fld('결제수단',sel('m_pay',PAYS,M.pay,lock))}
        ${fld('비목',sel('m_cat',CATS.map(c=>c.c),M.cat,lock,CATS.map(c=>c.n)))}
        ${fld('세부항목',sel('m_sub',SUBS[M.cat],M.sub,lock))}
        ${fld('품목',`<input type="text" id="m_item" value="${esc(M.item)}" ${lock?'disabled':''}>`)}
        ${fld('거래처',`<input type="text" id="m_vendor" value="${esc(M.vendor)}" ${lock?'disabled':''}>`)}
        ${fld('공급가액 (원)',`<input type="number" class="num" id="m_supply" value="${M.supply||''}" ${lock?'disabled':''}>`)}
        ${fld('세액 (원)',`<input type="number" class="num" id="m_vat" value="${M.vat||''}" ${lock?'disabled':''}>`)}
        ${fld('재원구분',sel('m_src',SRCS,M.src,lock))}
        ${fld('담당자',`<input type="text" id="m_owner" value="${esc(M.owner)}" ${lock?'disabled':''}>`)}
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" ${lock?'disabled':''} onclick="calcVat()">세액 10% 자동</button>
        <span class="small muted">합계 <b class="num">${won((+M.supply||0)+(+M.vat||0))}</b>원</span>
      </div>
      ${willOver&&!lock?`<div class="note e" style="margin-top:12px">
        <b>한도 경고</b> — ${cat(M.cat)} / ${M.src} 배정 ${won(a)}원 중 ${won(u)}원 집행됨.
        이 건을 확정하면 <b>${won(u+(+M.total||0)-a)}원</b> 초과합니다.
        <div style="margin-top:4px">등록은 되지만 「확정」으로 넘길 때 사유를 받습니다.</div></div>`:''}

      <h4 style="margin:18px 0 6px;font-size:13px">증빙 체크리스트</h4>
      <div class="small muted" style="margin-bottom:6px">
        결제수단(${M.pay})과 금액(${won(M.supply)}원) 기준으로 필요한 서류를 계산했습니다.
        ${v.ok?'<b style="color:var(--ok)">완비</b>':`<b style="color:var(--bad)">미비 ${v.missing.length}건</b>`}
      </div>
      ${need.map(r=>{
        const st=M.docs[r.d];
        return `<div class="chk">
          <div class="nm">${r.d}
            ${r.req?'<span class="badge b-bad" style="font-size:10.5px">필수</span>':
                    '<span class="badge b-plan" style="font-size:10.5px">선택</span>'}
            <div class="small muted">${r.why}</div></div>
          <div class="tg">
            <button class="${st==='have'?'on':''}" ${lock?'disabled':''}
              onclick="tog('${r.d}','have')">확보</button>
            <button class="na ${st==='na'?'on':''}" ${lock?'disabled':''}
              onclick="tog('${r.d}','na')">해당없음</button>
          </div></div>`;}).join('')}
      <div class="small muted" style="margin-top:8px">
        확보와 해당없음은 <b>서로 배타</b>입니다 — 한쪽을 켜면 다른 쪽이 꺼집니다(양방향).
      </div>
      ${M.memo?`<div class="note w" style="margin-top:12px">${esc(M.memo)}</div>`:''}
    </div>
    <div class="ft">
      ${M.id&&!lock?`<button class="btn" onclick="delExp()"
        style="color:var(--bad);margin-right:auto">삭제</button>`:''}
      <button class="btn" onclick="closeM()">닫기</button>
      ${lock?'':`<button class="btn pri" onclick="saveExp()">저장</button>`}
    </div>
  </div></div>`);
}
const fld=(l,i)=>`<div class="f"><label>${l}</label>${i}</div>`;
const esc=s=>String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function sel(id,vals,cur,lock,labels){
  return `<select id="${id}" ${lock?'disabled':''} onchange="onField()">
    ${vals.map((v,i)=>`<option value="${v}" ${v===cur?'selected':''}>${labels?labels[i]:v}</option>`).join('')}
  </select>`;
}
function grab(){
  const g=id=>document.getElementById(id);
  if(!g('m_date')) return;
  M.date=g('m_date').value; M.pay=g('m_pay').value;
  const oldCat=M.cat; M.cat=g('m_cat').value;
  M.sub = oldCat===M.cat ? g('m_sub').value : SUBS[M.cat][0];
  M.item=g('m_item').value; M.vendor=g('m_vendor').value;
  M.supply=Math.max(0,Math.round(+g('m_supply').value||0));
  M.vat=Math.max(0,Math.round(+g('m_vat').value||0));
  M.total=M.supply+M.vat; M.src=g('m_src').value; M.owner=g('m_owner').value;
}
function onField(){ grab(); redrawM(); }
function calcVat(){ grab(); M.vat=Math.round(M.supply*0.1); M.total=M.supply+M.vat; redrawM(); }
function tog(d,st){ grab(); M.docs[d] = (M.docs[d]===st) ? '' : st; redrawM(); }
function redrawM(){ closeM(true); drawExp(); }
function closeM(keep){ const m=document.getElementById('mask'); if(m) m.remove(); if(!keep) M=null; }
function saveExp(){
  grab();
  if(!M.item.trim()){ alert('품목을 넣어 주세요.'); return; }
  if(!M.vendor.trim()){ alert('거래처를 넣어 주세요.'); return; }
  if(M.supply+M.vat<=0){ alert('금액을 넣어 주세요.'); return; }
  const p=P();
  if(M.date<p.from||M.date>p.to){
    if(!confirm(`사용일 ${M.date}이 과제 기간(${p.from} ~ ${p.to}) 밖입니다.\n`+
      '기간 이탈은 정산에서 불인정될 수 있습니다. 그래도 저장할까요?')) return;
  }
  if(M.id){
    const i=S.expenses.findIndex(e=>e.id===M.id); S.expenses[i]=M;
    log(p.id,'사용 건 수정 — '+M.item);
  }else{
    M.id=++S.seq; S.expenses.push(M);
    log(p.id,`사용 건 등록 — ${M.item} ${won(M.total)}원 (${cat(M.cat)})`);
  }
  closeM(); render();
}
function delExp(){
  if(!confirm('이 사용 건과 증빙 기록을 지웁니다. 계속할까요?')) return;
  const p=P();
  S.expenses=S.expenses.filter(e=>e.id!==M.id);
  log(p.id,'사용 건 삭제 — '+M.item);
  closeM(); render();
}

/* ══════════════════════════════════════════════════════════════
   10. 모달 — 과제 등록 · 완료 전환
   ══════════════════════════════════════════════════════════════ */
function openNew(){
  document.body.insertAdjacentHTML('beforeend',`
  <div class="mask" id="mask"><div class="modal">
    <div class="hd">과제 등록</div>
    <div class="bd"><div class="grid" style="grid-template-columns:1fr 1fr">
      ${fld('과제명','<input type="text" id="n_name" placeholder="예: 고에너지밀도 이차전지 개발">')}
      ${fld('과제번호','<input type="text" id="n_code" placeholder="RS-2026-00000000">')}
      ${fld('부처','<input type="text" id="n_dept" value="중소벤처기업부">')}
      ${fld('전문기관','<input type="text" id="n_agency" value="중소기업기술정보진흥원">')}
      ${fld('사업명','<input type="text" id="n_biz">')}
      ${fld('협약번호','<input type="text" id="n_pact">')}
      ${fld('시작일','<input type="date" id="n_from">')}
      ${fld('종료일','<input type="date" id="n_to">')}
      ${fld('연차 수','<input type="number" class="num" id="n_years" value="2" min="1" max="5">')}
      ${fld('기관유형',sel('n_org',['중소기업','중견기업','대기업','비영리','대학','출연연'],'중소기업'))}
      ${fld('연결할 공고','<input type="text" id="n_ann" placeholder="공고명 (선택)">')}
      ${fld('협약 과제비 (원)','<input type="number" class="num" id="n_contract" placeholder="미확정이면 비움">')}
    </div>
    ${fld('인수인계 메모','<textarea id="n_memo" rows="2" placeholder="다음 사람이 알아야 할 것"></textarea>')}
    <div class="note i" style="margin-top:12px">
      등록하면 <b>진행 예정</b>으로 들어갑니다. 공고를 연결해두면 그 공고에서 읽은
      한도 규칙이 계상 검증에 그대로 쓰입니다.</div>
    </div>
    <div class="ft"><button class="btn" onclick="closeM()">닫기</button>
      <button class="btn pri" onclick="saveNew()">등록</button></div>
  </div></div>`);
}
function saveNew(){
  const g=id=>document.getElementById(id).value;
  if(!g('n_name').trim()){ alert('과제명을 넣어 주세요.'); return; }
  const id=++S.seq;
  S.projects.push({id, code:g('n_code')||'RS-미정', name:g('n_name'),
    dept:g('n_dept'), agency:g('n_agency'), biz:g('n_biz'), pact:g('n_pact'),
    from:g('n_from')||'2026-01-01', to:g('n_to')||'2026-12-31',
    years:Math.max(1,+g('n_years')||1), year:1, orgType:g('n_org'),
    status:'진행 예정', annName:g('n_ann'),
    contract:Math.max(0,Math.round(+g('n_contract')||0)),
    memo:g('n_memo'), fixed:false, closedMemo:''});
  log(id,'과제 등록');
  closeM(); view.ptab='진행 예정'; render();
}

// ★ 완료 전환 — 최종보고서를 넣었을 때 뜨는 확인창과 같은 것
function askClose(){
  const p=P(), k=projKpi(p.id);
  const L=ledger(p.id), left=L.reduce((a,r)=>a+r.left,0);
  const pend=exps(p.id).filter(e=>!['정산완료'].includes(e.status)).length;
  document.body.insertAdjacentHTML('beforeend',`
  <div class="mask" id="mask"><div class="modal" style="max-width:560px">
    <div class="hd">이 과제를 「완료」로 바꾸시겠습니까?</div>
    <div class="bd">
      <div class="note i">
        자료함에 <b>「보고서 › 최종」</b>으로 파일을 올리면 이 창이 자동으로 뜹니다.
        <div style="margin-top:4px">지금은 「완료 처리」 버튼으로 같은 창을 열었습니다.</div>
      </div>
      <div style="margin:14px 0 8px;font-weight:700">완료로 바꾸면</div>
      <ul style="margin:0;padding-left:20px;line-height:2">
        <li>사용 건 <b>${k.cnt}건</b>이 잠깁니다 (수정·삭제·첨부 불가)</li>
        <li${k.bad?' style="color:var(--bad)"':''}>증빙 미비 <b>${k.bad}건</b>이 미비인 채로 잠깁니다</li>
        <li>정산완료가 아닌 건이 <b>${pend}건</b> 남아 있습니다</li>
        <li${left<0?' style="color:var(--bad)"':''}>미집행 잔액 <b>${won(left)}원</b>이 남아 있습니다</li>
        <li class="muted">자료함은 계속 쓸 수 있습니다</li>
      </ul>
      <div class="f" style="margin-top:16px"><label>완료 메모</label>
        <input type="text" id="c_memo" placeholder="예: 3차년도 최종정산 제출 완료"></div>
      <div class="note w" style="margin-top:12px">
        되돌리려면 관리자가 「다시 열기」를 해야 하고, <b>누가 언제 열었는지 기록에 남습니다.</b></div>
    </div>
    <div class="ft">
      <button class="btn" onclick="closeM()">아니오, 파일만 저장</button>
      <button class="btn pri" onclick="doClose()">완료로 전환</button></div>
  </div></div>`);
}
function doClose(){
  const p=P(), memo=document.getElementById('c_memo').value.trim();
  p.status='완료'; p.closedMemo=memo;
  log(p.id,'완료 전환'+(memo?' — '+memo:''));
  closeM(); render();
}

/* ── 시작 ── */
load(); render();
